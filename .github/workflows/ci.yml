name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  backend:
    name: Backend Lint, Types, Tests & Invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoiceflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -e backend -e .

      - name: Lint with Ruff
        run: |
          ruff check backend eval mock_accounting
          ruff format --check backend eval mock_accounting

      - name: Type check with mypy
        run: |
          mypy backend/app eval

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/invoiceflow_test
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/invoiceflow_test
        run: |
          cd backend && alembic upgrade head

      - name: Run Backend & Security Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/invoiceflow_test
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/invoiceflow_test
          REDIS_URL: redis://localhost:6379/0
          EXTRACTOR: mock
        run: |
          pytest backend/tests -v --cov=app --cov-report=term-missing

      - name: Verify Operational Invariants
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/invoiceflow_test
        run: |
          python -m backend.app.cli.invariants

      - name: Run Mock Evaluation Harness
        run: |
          python -m eval.run --manifest data/synthetic/manifest.jsonl --inputs data/synthetic/pdfs --extractor mock --out eval/reports/
          python -m eval.check --report eval/reports/report.json

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd web && npm ci

      - name: Frontend Lint & Typecheck
        run: |
          cd web && npm run lint

      - name: Frontend Build
        run: |
          cd web && npm run build

  security_scan:
    name: Security & SAST Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit || true

      - name: Run npm audit
        run: |
          cd web && npm audit --audit-level=high || true

      - name: Run Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r backend/app -ll -ii || true

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  terraform_check:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive infra/

      - name: Terraform Validate (Staging)
        run: |
          cd infra/environments/staging
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate (Prod)
        run: |
          cd infra/environments/prod
          terraform init -backend=false
          terraform validate

  deploy_staging:
    name: Deploy to Staging (ECR & ECS)
    needs: [backend, frontend, security_scan, terraform_check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-staging-role
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: 123456789012.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building and tagging image $ECR_REGISTRY/invoiceflow-api:$IMAGE_TAG"
          # docker build -t $ECR_REGISTRY/invoiceflow-api:$IMAGE_TAG -f backend/Dockerfile .
          # docker push $ECR_REGISTRY/invoiceflow-api:$IMAGE_TAG

      - name: Run DB Migration Task (One-off ECS Task)
        run: |
          echo "Running alembic upgrade head as ECS one-off task"

      - name: Deploy Amazon ECS Task Definition
        run: |
          echo "Rolling update of ECS services with health-check verification"

  deploy_prod:
    name: Deploy to Production
    needs: [deploy_staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # Requires manual approval in GitHub environment settings
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-prod-role
          aws-region: ap-south-1

      - name: Deploy Production ECS Cluster
        run: |
          echo "Promoting verified staging SHA ${{ github.sha }} to production"
