[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceflow-backend"
version = "0.1.0"
description = "InvoiceFlow production-grade AI invoice processing backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "celery[redis]>=5.3.6",
    "redis>=5.0.2",
    "boto3>=1.34.0",
    "pymupdf>=1.23.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.2.0",
    "rapidfuzz>=3.6.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "groq>=0.5.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "respx>=0.21.1",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "reportlab>=4.1.0",
    "faker>=24.0.0",
    "types-pyyaml>=6.0.12",
    "types-redis>=4.6.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow load tests (run with -m slow)",
    "openwa_live: marks live contract tests against running OpenWA container (run with -m openwa_live)",
]
addopts = "-v --cov=app --cov-report=term-missing --cov-fail-under=85 -m 'not slow'"

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]

