services:
  postgres:
    image: postgres:16-alpine
    container_name: invoiceflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-invoiceflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoiceflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: invoiceflow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: invoiceflow_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/invoiceflow}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://postgres:postgres@postgres:5432/invoiceflow}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-invoices}
      ACCOUNTING_API_URL: http://mock-accounting:8001
      EXTRACTOR: ${EXTRACTOR:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_TEXT_MODEL: ${GROQ_TEXT_MODEL:-qwen/qwen3.8-27b}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      OPENWA_BASE_URL: http://openwa:2785/api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/alembic:/app/backend/alembic
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mock-accounting:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: invoiceflow_worker
    command: celery -A app.workers.celery_app worker --beat --loglevel=info --concurrency=4 -Ofair
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/invoiceflow}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://postgres:postgres@postgres:5432/invoiceflow}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-invoices}
      ACCOUNTING_API_URL: http://mock-accounting:8001
      EXTRACTOR: ${EXTRACTOR:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_TEXT_MODEL: ${GROQ_TEXT_MODEL:-qwen/qwen3.8-27b}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      OPENWA_BASE_URL: http://openwa:2785/api
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/alembic:/app/backend/alembic
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  mock-accounting:
    build:
      context: .
      dockerfile: mock_accounting/Dockerfile
    container_name: invoiceflow_mock_accounting
    ports:
      - "8001:8001"
    environment:
      FAULT_RATE: ${FAULT_RATE:-0.0}
      LATENCY_MS: ${LATENCY_MS:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/_debug/invoices')"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: invoiceflow_web
    ports:
      - "80:80"
      - "5173:80"
    environment:
      BACKEND_URL: http://api:8000
    volumes:
      - ./web/src:/app/src
      - ./web/vite.config.ts:/app/vite.config.ts
    depends_on:
      api:
        condition: service_started

  openwa:
    image: ${OPENWA_IMAGE:-rmyndharis/openwa:latest}
    container_name: invoiceflow_openwa
    profiles:
      - whatsapp
    shm_size: "512mb"
    ports:
      - "2785:2785"
    volumes:
      - openwa_data:/app/data
    environment:
      - PORT=2785
      - ENGINE_TYPE=whatsapp-web.js
      - AUTO_START_SESSIONS=true
      - WWEBJS_AUTH_TIMEOUT_MS=120000
      - WWEBJS_WEB_VERSION=off
      - SEND_PACING_ENABLED=true
      - SSRF_ALLOWED_HOSTS=api,host.docker.internal
      - WEBHOOK_SSRF_PROTECT=false
      - MEDIA_DOWNLOAD_ENABLED=true
      - MEDIA_DOWNLOAD_TIMEOUT_MS=60000
      - WEBHOOK_MEDIA_INLINE_MAX_BYTES=52428800
      - MEDIA_DOWNLOAD_MAX_BYTES=52428800
      - CHAT_MEDIA_ARCHIVE_ENABLED=true
      - NODE_ENV=production
      - CSP_UPGRADE_INSECURE_REQUESTS=false
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2785/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  openwa_data:
