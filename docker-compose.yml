services:
  postgres:
    image: postgres:16-alpine
    container_name: invoiceflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-invoiceflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoiceflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: invoiceflow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: invoiceflow_minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-create-buckets:
    image: minio/mc:latest
    container_name: invoiceflow_minio_buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/invoices;
      /usr/bin/mc anonymous set download myminio/invoices;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: invoiceflow_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/invoiceflow
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/invoiceflow
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: invoices
      ACCOUNTING_API_URL: http://mock-accounting:8001
      EXTRACTOR: ${EXTRACTOR:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_TEXT_MODEL: ${GROQ_TEXT_MODEL:-llama-3.3-70b-versatile}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-llama-3.2-11b-vision-preview}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/backend/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-buckets:
        condition: service_completed_successfully
      mock-accounting:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: invoiceflow_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Ofair
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/invoiceflow
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/invoiceflow
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: invoices
      ACCOUNTING_API_URL: http://mock-accounting:8001
      EXTRACTOR: ${EXTRACTOR:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_TEXT_MODEL: ${GROQ_TEXT_MODEL:-llama-3.3-70b-versatile}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-llama-3.2-11b-vision-preview}
    volumes:
      - ./backend/app:/app/backend/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-buckets:
        condition: service_completed_successfully

  mock-accounting:
    build:
      context: .
      dockerfile: mock_accounting/Dockerfile
    container_name: invoiceflow_mock_accounting
    ports:
      - "8001:8001"
    environment:
      FAULT_RATE: ${FAULT_RATE:-0.0}
      LATENCY_MS: ${LATENCY_MS:-0}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/_debug/invoices || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: invoiceflow_web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./web/src:/app/src
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  minio_data:
